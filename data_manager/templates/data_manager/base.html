<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GDSS2026 Data Manager{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="{% url 'home' %}">GDSS2026 Data</a></strong></li>
      </ul>
      <ul>
        <li><a href="{% url 'crop_list' %}">Crop data</a></li>
        <li><a href="{% url 'fertilizer_list' %}">Fertilizer data</a></li>
        <li><a href="{% url 'upload_csv' %}">Upload CSV</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% if messages %}
      {% for message in messages %}
        <article class="message {{ message.tags }}">{{ message }}</article>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
