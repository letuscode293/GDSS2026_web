<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GDSS2026{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-w: 260px;
      --brand: #1e6b45;
      --brand-dark: #155a38;
    }
    body {
      background: #f4f6f8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      background: #1a2332;
      color: #c9d3df;
      flex-shrink: 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      overflow-y: auto;
      z-index: 1000;
    }
    .sidebar-brand {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-brand a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -.02em;
    }
    .sidebar-brand small {
      display: block;
      color: #8b9cb0;
      font-size: .75rem;
      font-weight: 400;
      margin-top: .15rem;
    }
    .sidebar .nav-link {
      color: #b8c5d3;
      padding: .65rem 1.25rem;
      border-radius: 0;
      font-size: .9rem;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .sidebar .nav-link:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sidebar .nav-link.active {
      background: rgba(30, 107, 69, .25);
      color: #fff;
      border-left: 3px solid var(--brand);
      padding-left: calc(1.25rem - 3px);
    }
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 1.75rem 2rem 2.5rem;
      width: calc(100% - var(--sidebar-w));
    }
    .page-title { font-size: 1.5rem; font-weight: 600; margin: 0; color: #1a2332; }
    .page-sub { color: #6c757d; font-size: .9rem; margin: .25rem 0 0; }
    .stat-card {
      border: none;
      border-radius: .75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .stat-card .display-6 { font-weight: 700; color: var(--brand); }
    .card { border: none; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .table-card .table { margin: 0; }
    .table-card .table thead th {
      background: #f8f9fa;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #6c757d;
      font-weight: 600;
      border-bottom: 1px solid #dee2e6;
    }
    .btn-brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-brand:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
    @media (max-width: 768px) {
      .sidebar { position: static; width: 100%; }
      .main { margin-left: 0; width: 100%; padding: 1rem; }
      .layout { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="{% url 'home' %}">GDSS2026<small>Data Manager</small></a>
      </div>
      <nav class="nav flex-column py-2">
        <a class="nav-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}" href="{% url 'home' %}">
          <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a class="nav-link{% if 'crop' in request.resolver_match.url_name %} active{% endif %}" href="{% url 'crop_list' %}">
          <i class="bi bi-flower1"></i> Crop data
        </a>
        <a class="nav-link{% if 'fertilizer' in request.resolver_match.url_name %} active{% endif %}" href="{% url 'fertilizer_list' %}">
          <i class="bi bi-droplet"></i> Fertilizer data
        </a>
        <a class="nav-link{% if request.resolver_match.url_name == 'upload_csv' %} active{% endif %}" href="{% url 'upload_csv' %}">
          <i class="bi bi-upload"></i> Upload CSV
        </a>
      </nav>
    </aside>

    <div class="main">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
