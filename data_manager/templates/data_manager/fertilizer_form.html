{% extends "data_manager/base.html" %}

{% block title %}Add fertilizer record | GDSS2026{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>Add fertilizer record</h1>
    <p>Fields match <code>Fertilizer_Prediction.csv</code></p>
  </div>
</header>

<div class="form-card">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      {{ form.as_p }}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save record</button>
      <a href="{% url 'fertilizer_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
