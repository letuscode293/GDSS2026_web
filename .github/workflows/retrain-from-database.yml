name: Retrain from database

on:
  workflow_dispatch:
  repository_dispatch:
    types: [data-changed]
  schedule:
    # Daily at 06:00 UTC — optional automatic retrain
    - cron: "0 6 * * *"

jobs:
  export-train-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          path: web
          token: ${{ secrets.GH_PAT }}

      - name: Checkout ML tutorial repo
        uses: actions/checkout@v4
        with:
          repository: letuscode293/tutorial
          ref: richard
          path: tutorial
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export data from Render PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "false"
        run: |
          cd web
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py export_datasets
          cp datasets/Crop_recommendation.csv ../tutorial/datasets/
          cp datasets/Fertilizer_Prediction.csv ../tutorial/datasets/

      - name: Train models
        run: |
          cd tutorial
          pip install -r requirements.txt
          python scripts/train_tabular.py
          pytest tests/ -v

      - name: Commit updated datasets and models (tutorial)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd tutorial
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/*.csv models/*.pkl
          git diff --staged --quiet || git commit -m "Auto-retrain: export DB, update models [skip ci]"
          git push origin HEAD:richard

      - name: Commit updated seed datasets (web)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd web
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/*.csv
          git diff --staged --quiet || git commit -m "Auto-export datasets from database [skip ci]"
          git push origin HEAD:richard
