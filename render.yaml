services:
  - type: web
    name: gdss2026-web
    runtime: python
    plan: free
    repo: https://github.com/letuscode293/GDSS2026_web
    branch: richard
    autoDeploy: true
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTO_PIPELINE
        value: "false"
      - key: GITHUB_RETRAIN
        value: "true"
      - key: GITHUB_REPOSITORY
        value: letuscode293/GDSS2026_web
      - key: GITHUB_REF
        value: richard
      # Set after deploying gdss2026-api (tutorial repo blueprint):
      # API_RELOAD_URL=https://gdss2026-api.onrender.com/reload-models
      # GITHUB_TOKEN=ghp_... (your PAT with workflow + repo scope)
      - key: WEB_CONCURRENCY
        value: 2
      # If you created the DB manually (e.g. "GDSS"), set DATABASE_URL in the
      # Render dashboard instead of using fromDatabase below.
      - key: DATABASE_URL
        fromDatabase:
          name: gdss2026-db
          property: connectionString

databases:
  - name: gdss2026-db
    plan: free
    databaseName: gdss2026
    user: gdss2026
