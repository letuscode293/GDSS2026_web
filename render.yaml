services:
  - type: web
    name: gdss2026-web
    runtime: python
    plan: free
    repo: https://github.com/letuscode293/GDSS2026_web
    branch: richard
    autoDeploy: true
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTO_PIPELINE
        value: "false"
      - key: WEB_CONCURRENCY
        value: 2
      # If you created the DB manually (e.g. "GDSS"), set DATABASE_URL in the
      # Render dashboard instead of using fromDatabase below.
      - key: DATABASE_URL
        fromDatabase:
          name: gdss2026-db
          property: connectionString

databases:
  - name: gdss2026-db
    plan: free
    databaseName: gdss2026
    user: gdss2026
